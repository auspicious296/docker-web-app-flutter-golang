# ログイン API の呼び出し回数の制限（ADR 0014）
#
# 同じ送信元（IP アドレス）からの呼び出しを、成功・失敗を問わず数える。同じ IP
# アドレスを共有する利用者（同じオフィスなど）は合わせて数えるため、値は正規の
# 利用者が一斉にログインしても届かない高さにし、1 つの送信元から大量に送りつける
# 攻撃だけを止める。平均の上限は 1 秒に 1 回、一時的な超過の許容（burst）は 60 回。
# この値は雛形の値であり、本番では同時にログインする利用者の実際の人数に合わせて調整する。
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

# HTTP（80 番）へのアクセスは HTTPS へ転送する
server {
    listen 80;
    server_name myapp.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name myapp.local;

    # mkcert で作成した証明書（docs/setup/local-https-setup-guide-for-mac.md 参照）
    ssl_certificate     /etc/nginx/certs/myapp.local.pem;
    ssl_certificate_key /etc/nginx/certs/myapp.local-key.pem;

    # Go API へ転送するときに付けるヘッダー。/api/ 配下の各 location が引き継ぐ
    # （location の中で proxy_set_header を書くと引き継がれなくなるため、ここにまとめる）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/ 配下は Go API へ転送する（パスは /api/... のまま API に届く）
    #
    # gzip は有効にしない。CSRF トークンを返すレスポンスを圧縮すると、圧縮後の
    # サイズの変化からトークンを推測される（BREACH 攻撃）ためである（ADR 0012）。
    location /api/ {
        proxy_pass http://api:8080;
    }

    # ログイン API（Web 用・モバイル用）には呼び出し回数の制限をかける。2 つは同じ
    # zone を使い、合わせて数える（別々に数えると、両方を使って 2 倍試せるため）
    location = /api/login {
        limit_req        zone=login burst=60 nodelay;
        limit_req_status 429;
        error_page       429 @too_many_login_requests;
        proxy_pass       http://api:8080;
    }

    location = /api/mobile/login {
        limit_req        zone=login burst=60 nodelay;
        limit_req_status 429;
        error_page       429 @too_many_login_requests;
        proxy_pass       http://api:8080;
    }

    # 制限にかかったときの返答。nginx の既定（503 と HTML）のままでは、/api/ 配下の
    # 失敗は必ず {"error":{...}} の形で返すという決まり（ADR 0004）が崩れるため、
    # 429 と JSON を返す。リクエストは Go の API まで届かない。
    # 文字列中の \\n は、nginx が \n（JSON の改行の表記）として出力する。
    location @too_many_login_requests {
        default_type "application/json; charset=utf-8";
        return 429 '{"error":{"code":"too_many_requests","message":"ただいまログインの処理が集中しているため、受け付けられませんでした。\\nしばらく待ってから、もう一度お試しください。"}}\n';
    }

    # それ以外は Flutter のビルド成果物（frontend/build/web/）を配信する
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;

        # Flutter Web の成果物は main.dart.js のようにファイル名が固定で、
        # 内容が変わっても名前が変わらない。キャッシュの判断をブラウザに
        # 任せると、デプロイ後も古いものが使われ続けるため、使用前に必ず
        # サーバーへ確認させる。変更がなければ 304 を返すだけで本文は
        # 転送しないため、転送量はほとんど増えない。
        add_header Cache-Control "no-cache";
    }
}
