# 環境変数の値は、同じ階層の .env から読み込む（.env.example をコピーして作成する）

services:
  nginx:
    image: nginx:1.30.4-alpine
    depends_on:
      - api
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./docker-containers/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker-containers/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro

  api:
    build: ./backend
    depends_on:
      # DB が受け付けられる状態になってから起動する（API は起動時に接続を確認し、
      # 失敗したら終了するため）
      db:
        condition: service_healthy
    environment:
      # ホストから migrate コマンドで使う接続先はホスト名が localhost、
      # コンテナ内からは db になるため、.env では持たずここで組み立てる
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # API が返す日時とログのタイムゾーン（DB 側は 000003 のマイグレーションで設定する）
      TZ: Asia/Tokyo
      # ログイン前の CSRF トークンの署名に使う秘密鍵。秘密の値のため .env に置く（ADR 0012）
      CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY}
      # Web 用の API で許可するオリジン。本番では compose.prod.yaml で上書きする（ADR 0014）
      ALLOWED_ORIGIN: https://myapp.local
      # ログイン状態の保持期間（ADR 0013）。書式は Go の time.ParseDuration に従い、
      # 日の単位がないため日単位の値は時間に換算する（30 日 = 720h、90 日 = 2160h）
      SESSION_WEB_IDLE_TIMEOUT: 30m
      SESSION_WEB_ABSOLUTE_TIMEOUT: 8h
      SESSION_MOBILE_IDLE_TIMEOUT: 720h
      SESSION_MOBILE_ABSOLUTE_TIMEOUT: 2160h

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 以降の公式イメージは /var/lib/postgresql をマウント先とする
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.17
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
